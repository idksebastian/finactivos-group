name: Supabase Keep-Alive

# Prevents the Supabase free-tier project from auto-pausing after 7 days of
# database inactivity. This is intentional infrastructure, not leftover
# scaffolding -- do not delete it.
#
# Supabase only counts real database activity, not requests to the bare
# project URL, so this runs an actual SELECT against a real table (site_
# settings) through the PostgREST API using the anon key. A plain curl to
# the project's root URL does NOT prevent the pause.
#
# Runs on a day-of-month step of 5 (1, 6, 11, 16, 21, 26, and 31 when it
# exists), which never leaves more than a ~5 day gap between runs -- safely
# inside Supabase's 7-day inactivity window. Also runnable manually via
# workflow_dispatch for testing.
#
# Requires two repository secrets (Settings -> Secrets and variables ->
# Actions): SUPABASE_URL and SUPABASE_ANON_KEY. Only the anon key is needed
# -- this is a read-only ping, never use the service_role key here.

on:
  schedule:
    - cron: "0 5 */5 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query a real table via the Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          response=$(curl -sS -w "\n%{http_code}" \
            "$SUPABASE_URL/rest/v1/site_settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          echo "HTTP status: $http_code"
          echo "Response body: $body"

          if [ "$http_code" -ne 200 ]; then
            echo "::error::Keep-alive query failed with HTTP $http_code -- Supabase project may pause from inactivity."
            exit 1
          fi

          echo "Keep-alive query succeeded -- database activity registered."
